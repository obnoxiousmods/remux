server {
    include /etc/nginx/snippets/reject-probes.conf;
    server_name remux.obnoxious.lol;

    location = / {
        return 302 /web/;
    }

    # jellyfin-web exposes these API routes beneath its otherwise-static prefix.
    location ~* ^/web/configurationpages?$ {
        add_header Cache-Control "no-store" always;
        proxy_pass http://127.0.0.1:3008;
        proxy_hide_header Access-Control-Allow-Headers;
        add_header Access-Control-Allow-Headers "Accept, Authorization, Content-Type, Range, X-Emby-Token" always;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    location /web/ {
        alias /opt/remux/jellyfin-web/;
        add_header Cache-Control "no-cache" always;
        index index.html;
        try_files $uri $uri/ /web/index.html;
    }

    location = /admin {
        return 301 /admin/;
    }

    location /admin/ {
        alias /opt/remux/current/dashboard/;
        index index.html;
        try_files $uri $uri/ /admin/index.html;
        add_header Service-Worker-Allowed "/admin/";
        add_header Cache-Control "no-cache";
    }

    location / {
        proxy_pass http://127.0.0.1:3008;
        proxy_hide_header Access-Control-Allow-Headers;
        add_header Access-Control-Allow-Headers "Accept, Authorization, Content-Type, Range, X-Emby-Token" always;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # A first request for an uncached embedded subtitle can perform one
        # bounded sequential container scan. Keep that request attached long
        # enough for a useful foreground wait while the detached backend task
        # continues a larger scan beyond the browser request lifetime.
        proxy_read_timeout 300s;
    }

    listen 443 ssl;
    listen 443 quic;
    ssl_certificate /etc/letsencrypt/live/obnoxious.lol/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/obnoxious.lol/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    access_log /var/log/nginx/remux.obnoxious.lol.access.log vhost;
    error_log /var/log/nginx/remux.obnoxious.lol.error.log warn;
}
